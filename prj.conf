# prj.conf – Zephyr-owned SAI + Zephyr DMA ADF path

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y
CONFIG_FAULT_DUMP=2

# Zephyr-owned SAI/I2S + GPDMA path
CONFIG_I2S=y
CONFIG_DMA=y
CONFIG_DMA_STM32U5=y

# ADF1 HAL MDF + HAL GPIO (no native Zephyr ADF driver)
CONFIG_APP_USE_ADF_PDM=y

CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_STM32_CUBE=y
CONFIG_PINCTRL=y
CONFIG_ISR_STACK_SIZE=2048
CONFIG_FPU=y

CONFIG_PM=n
CONFIG_APP_AUDIO_DIAG=n
